# Nginx 基础配置（被 /etc/nginx/nginx.conf 的 http{} include 引入）
# 目标：只覆盖“底层痛点项”，不涉及任何业务 server/upstream/location 逻辑。
#
# 放置位置建议：/etc/nginx/conf.d/00-nginx-base.conf
# 注意：该文件内容必须是 http 作用域可用的指令（不要写 http { }）。

# 减少 docker logs 噪音：只输出 warn/error 到 stderr（业务 conf 若单独设置 error_log 会覆盖）
error_log /dev/stderr warn;

# 没有显式配置 access_log 的站点，默认关闭（业务 conf 若设置 access_log 会覆盖）
access_log off;

# 安全小项（不影响业务逻辑）
server_tokens off;

# 性能小项：静态文件打开缓存（降低频繁 stat/open 成本）
open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Gzip（全局默认；若业务 conf 已配置 gzip，这里作为兜底/统一默认）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
gzip_disable "msie6";


